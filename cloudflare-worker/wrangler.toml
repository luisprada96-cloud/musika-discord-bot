name = "musika"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

routes = [
  { pattern = "musika.luisjourney.xyz/*", zone_name = "luisjourney.xyz" },
  { pattern = "app.luisjourney.xyz", custom_domain = true }
]

[[kv_namespaces]]
binding = "PLAYLISTS_KV"
id = "d2ae90b10ab94c6dbb9f96e43bdfb25d"

[vars]
BOT_PING_URL = "https://musika-discord-bot.onrender.com/api/state"


[[d1_databases]]
binding = "DB"
database_name = "musika-db"
database_id = "d844a229-2aca-44a5-8e5f-aec01c98bfb1"

