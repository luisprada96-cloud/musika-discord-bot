<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusiKa — Gestor de Playlists</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181b24;
      --panel-hover: #212634;
      --border: #2a3042;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --green: #23a55a;
      --red: #f23f43;
      --text: #f2f3f5;
      --muted: #949ba4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .status-badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #1e2330;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status-badge.online {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.3);
    }
    .container {
      max-width: 1150px;
      width: 100%;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      flex: 1;
    }
    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h2 {
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-green { background: var(--green); }
    button.btn-green:hover { background: #1a8245; }
    button.btn-red { background: rgba(242, 63, 67, 0.15); color: #ff6b6e; border: 1px solid rgba(242, 63, 67, 0.3); }
    button.btn-red:hover { background: var(--red); color: white; }
    button.btn-secondary { background: #262b3b; color: var(--text); }
    button.btn-secondary:hover { background: #32394e; }

    .playlist-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .playlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .playlist-item:hover {
      background: var(--panel-hover);
    }
    .playlist-item.active {
      background: rgba(88, 101, 242, 0.18);
      border-color: var(--accent);
    }
    .playlist-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .playlist-count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .now-playing-bar {
      background: linear-gradient(90deg, rgba(88,101,242,0.16), rgba(35,165,90,0.12));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .np-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .np-thumb {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      object-fit: cover;
      background: #222;
    }
    .np-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 420px;
    }
    .np-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .track-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .track-num {
      color: var(--muted);
      font-size: 0.85rem;
      width: 22px;
      text-align: right;
    }
    .track-thumb {
      width: 48px;
      height: 36px;
      border-radius: 5px;
      object-fit: cover;
      background: #1c202b;
      flex-shrink: 0;
    }
    .track-meta {
      min-width: 0;
      flex: 1;
    }
    .track-title {
      font-weight: 500;
      font-size: 0.93rem;
      color: var(--text);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-title:hover { text-decoration: underline; color: #939bf8; }
    .track-duration {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e2330;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🎵 MusiKa — Panel de Playlists</div>
    <div id="botStatus" class="status-badge">Conectando con el bot...</div>
  </header>

  <div class="container">
    <!-- Columna izquierda: Listas -->
    <div class="card">
      <h2>📂 Tus Playlists</h2>
      <form id="createPlaylistForm" class="input-row">
        <input type="text" id="newPlaylistName" placeholder="Nombre de nueva lista..." required />
        <button type="submit">➕ Crear</button>
      </form>
      <div id="playlistList" class="playlist-list"></div>
    </div>

    <!-- Columna derecha: Reproductor + Detalle de Playlist -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Barra de estado de reproducción en Discord -->
      <div class="now-playing-bar">
        <div class="np-info">
          <img id="npThumb" class="np-thumb" src="" alt="" style="display:none;" />
          <div>
            <div id="npTitle" class="np-title">Nada sonando ahora mismo</div>
            <div id="npSub" class="np-sub">Usa /play en Discord o lanza una lista desde aquí</div>
          </div>
        </div>
        <div class="controls">
          <button class="btn-secondary" onclick="playerAction('pause_resume')">⏯️ Pausar/Reanudar</button>
          <button class="btn-secondary" onclick="playerAction('skip')">⏭️ Saltar</button>
          <button class="btn-red" onclick="playerAction('stop')">⏹️ Parar</button>
        </div>
      </div>

      <!-- Editor de la playlist seleccionada -->
      <div class="card" id="playlistDetailCard">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <h2 id="currentPlaylistTitle">Selecciona o crea una playlist</h2>
            <div id="currentPlaylistSub" style="font-size:0.82rem; color:var(--muted); margin-top:2px;"></div>
          </div>
          <div class="controls" id="playlistActions" style="display:none;">
            <button class="btn-green" onclick="playCurrentPlaylist(false)">▶️ Sonar en Discord</button>
            <button class="btn-secondary" onclick="playCurrentPlaylist(true)">🔀 Shuffle</button>
            <button class="btn-red" onclick="deleteCurrentPlaylist()">🗑️ Borrar Lista</button>
          </div>
        </div>

        <form id="addSongForm" class="input-row" style="display:none;">
          <input type="text" id="songQueryInput" placeholder="Escribe el nombre de una canción o pega un link de YouTube/SoundCloud/Suno AI..." required />
          <button type="submit" id="addSongBtn">➕ Añadir Canción</button>
        </form>

        <div id="trackList" class="track-list">
          <div class="empty-state">👈 Elige una playlist de la izquierda o crea una nueva para empezar a meter temazos.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let playlists = {};
    let selectedPlaylist = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3200);
    }

    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        playlists = data.playlists || {};

        const badge = document.getElementById('botStatus');
        badge.textContent = `🟢 Bot Online (${data.bot_name || 'MusiKa'})`;
        badge.classList.add('online');

        // Actualizar barra de "Sonando ahora"
        const npTitle = document.getElementById('npTitle');
        const npSub = document.getElementById('npSub');
        const npThumb = document.getElementById('npThumb');
        if (data.now_playing) {
          npTitle.textContent = `🎶 ${data.now_playing.title}`;
          npSub.textContent = `Duración: ${data.now_playing.duration_str} • En cola: ${data.queue_length} más`;
          if (data.now_playing.thumbnail) {
            npThumb.src = data.now_playing.thumbnail;
            npThumb.style.display = 'block';
          } else {
            npThumb.style.display = 'none';
          }
        } else {
          npTitle.textContent = 'Nada sonando ahora mismo';
          npSub.textContent = 'Entra a un canal de voz en Discord y dale a ▶️ Sonar en Discord';
          npThumb.style.display = 'none';
        }

        renderPlaylists();
        if (selectedPlaylist && playlists[selectedPlaylist]) {
          renderTracks(selectedPlaylist);
        } else if (selectedPlaylist && !playlists[selectedPlaylist]) {
          selectedPlaylist = null;
          renderTracks(null);
        } else if (!selectedPlaylist && Object.keys(playlists).length > 0) {
          selectedPlaylist = Object.keys(playlists)[0];
          renderPlaylists();
          renderTracks(selectedPlaylist);
        }
      } catch (e) {
        const badge = document.getElementById('botStatus');
        badge.textContent = '🔴 Sin conexión con el bot';
        badge.classList.remove('online');
      }
    }

    function renderPlaylists() {
      const container = document.getElementById('playlistList');
      const names = Object.keys(playlists);
      if (names.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding:18px 8px;">No hay listas todavía. ¡Crea la primera arriba!</div>';
        return;
      }
      container.innerHTML = names.map(name => {
        const count = playlists[name].length;
        const active = name === selectedPlaylist ? 'active' : '';
        return `
          <div class="playlist-item ${active}" onclick="selectPlaylist('${ name.replace(/'/g, "\\'") }')">
            <span class="playlist-name">🎵 ${escapeHtml(name)}</span>
            <span class="playlist-count">${count} ${count === 1 ? 'canción' : 'canciones'}</span>
          </div>
        `;
      }).join('');
    }

    function selectPlaylist(name) {
      selectedPlaylist = name;
      renderPlaylists();
      renderTracks(name);
    }

    function renderTracks(name) {
      const titleEl = document.getElementById('currentPlaylistTitle');
      const subEl = document.getElementById('currentPlaylistSub');
      const actionsEl = document.getElementById('playlistActions');
      const addForm = document.getElementById('addSongForm');
      const listEl = document.getElementById('trackList');

      if (!name || !playlists[name]) {
        titleEl.textContent = 'Selecciona o crea una playlist';
        subEl.textContent = '';
        actionsEl.style.display = 'none';
        addForm.style.display = 'none';
        listEl.innerHTML = '<div class="empty-state">👈 Elige una playlist de la izquierda o crea una nueva.</div>';
        return;
      }

      const tracks = playlists[name];
      titleEl.textContent = `💿 ${name}`;
      subEl.textContent = `${tracks.length} ${tracks.length === 1 ? 'canción guardada' : 'canciones guardadas'} • También puedes ponerla en Discord con /playlist ${name}`;
      actionsEl.style.display = 'flex';
      addForm.style.display = 'flex';

      if (tracks.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Esta lista está vacía. Escribe arriba el nombre de cualquier canción o pega un link para añadirla.</div>';
        return;
      }

      listEl.innerHTML = tracks.map((t, idx) => `
        <div class="track-row">
          <div class="track-left">
            <span class="track-num">${idx + 1}.</span>
            ${t.thumbnail ? `<img class="track-thumb" src="${escapeHtml(t.thumbnail)}" alt="" />` : '<div class="track-thumb"></div>'}
            <div class="track-meta">
              <a class="track-title" href="${escapeHtml(t.webpage_url)}" target="_blank" rel="noopener">${escapeHtml(t.title)}</a>
              <span class="track-duration">⏱️ ${escapeHtml(t.duration_str || '')}</span>
            </div>
          </div>
          <div class="controls">
            <button class="btn-secondary" title="Añadir esta canción a la cola actual" onclick="playSingleTrack('${escapeJs(t.webpage_url)}')">▶️ Sonar</button>
            <button class="btn-red" title="Quitar de la lista" onclick="removeTrack(${idx})">✖</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('createPlaylistForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('newPlaylistName');
      const name = input.value.trim();
      if (!name) return;
      const res = await fetch('/api/playlists', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (res.ok) {
        input.value = '';
        selectedPlaylist = name;
        showToast(`✅ Lista "${name}" creada`);
        await fetchState();
      } else {
        showToast(`⚠️ ${data.error || 'Error al crear la lista'}`);
      }
    });

    document.getElementById('addSongForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedPlaylist) return;
      const input = document.getElementById('songQueryInput');
      const btn = document.getElementById('addSongBtn');
      const query = input.value.trim();
      if (!query) return;

      btn.disabled = true;
      btn.textContent = '⏳ Buscando...';
      try {
        const res = await fetch(`/api/playlists/${encodeURIComponent(selectedPlaylist)}/tracks`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        if (res.ok) {
          input.value = '';
          showToast(`➕ Añadida: ${data.track.title}`);
          await fetchState();
        } else {
          showToast(`⚠️ ${data.error || 'No se encontró la canción'}`);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '➕ Añadir Canción';
      }
    });

    async function removeTrack(index) {
      if (!selectedPlaylist) return;
      const res = await fetch(`/api/playlists/${encodeURIComponent(selectedPlaylist)}/tracks/${index}`, {
        method: 'DELETE'
      });
      if (res.ok) {
        showToast('🗑️ Canción eliminada de la lista');
        await fetchState();
      }
    }

    async function deleteCurrentPlaylist() {
      if (!selectedPlaylist) return;
      if (!confirm(`¿Seguro que quieres borrar la lista "${selectedPlaylist}"?`)) return;
      const name = selectedPlaylist;
      const res = await fetch(`/api/playlists/${encodeURIComponent(name)}`, {
        method: 'DELETE'
      });
      if (res.ok) {
        selectedPlaylist = null;
        showToast(`🗑️ Lista "${name}" borrada`);
        await fetchState();
      }
    }

    async function playCurrentPlaylist(shuffle) {
      if (!selectedPlaylist) return;
      const res = await fetch(`/api/playlists/${encodeURIComponent(selectedPlaylist)}/play`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ shuffle })
      });
      const data = await res.json();
      if (res.ok) {
        showToast(`🎶 ${data.message}`);
        await fetchState();
      } else {
        showToast(`⚠️ ${data.error}`);
      }
    }

    async function playSingleTrack(url) {
      const res = await fetch('/api/player/play', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query: url })
      });
      const data = await res.json();
      if (res.ok) {
        showToast(`▶️ ${data.message}`);
        await fetchState();
      } else {
        showToast(`⚠️ ${data.error}`);
      }
    }

    async function playerAction(action) {
      const res = await fetch(`/api/player/${action}`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        showToast(data.message || 'Hecho');
        await fetchState();
      } else {
        showToast(`⚠️ ${data.error || 'No disponible'}`);
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }
    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    fetchState();
    setInterval(fetchState, 4000);
  </script>
</body>
</html>
